<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animations</title>
    <style>
        .box {
            width: 100px;
            height: 100px;
            background-color: red;
            position: relative;
            border-radius: 40px;
            animation-name: ChangeColor;
            animation-duration: 4s;
        }

        @keyframes ChangeColor {
            from {
                background-color: red;
            }

            to {
                background-color: rgb(204, 204, 120);
            }
        }

        .box1 {
            width: 100px;
            height: 100px;
            background-color: blue;
            position: relative;
            border-radius: 40px;
            animation-name: ChangeColorpercent;
            animation-duration: 7s;
            animation-direction: reverse;
            animation-timing-function: ease-in-out;

        }

        @keyframes ChangeColorpercent {

            0% {
                background-color: blue;
                top: 0px;
                left: 0px;
            }

            25% {
                background-color: purple;
                top: 0px;
                left: 200px;
            }

            50% {
                background-color: green;
                top: 200px;
                left: 200px;
            }

            75% {
                background-color: orange;
                top: 200px;
                left: 0px;
            }

            100% {
                background-color: yellow;
                top: 0px;
                left: 0px;
            }

        }

        #div1 {
            display: flex;
            width: 100px;
            height: 100px;
            background-color: lightblue;
            color: black;
            position: relative;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            animation-name: animate;
            animation-duration: 4s;
            animation-timing-function: ease;


        }

        #div2 {
            display: flex;
            width: 100px;
            height: 100px;
            background-color: rgb(149, 115, 241);
            color: black;
            position: relative;
            text-align: center;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            animation-name: animate;
            animation-duration: 4s;
            animation-timing-function: linear;


        }

        #div3 {
            width: 100px;
            height: 100px;
            background-color: rgb(230, 79, 192);
            color: black;
            position: relative;
            text-align: center;
            border-radius: 40px;
            animation-name: animate;
            display: flex;
            align-items: center;
            justify-content: center;
            animation-duration: 4s;
            animation-timing-function: ease-in;


        }

        #div4 {
            display: flex;
            width: 100px;
            height: 100px;
            background-color: rgb(4, 98, 129);
            color: black;
            position: relative;
            text-align: center;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            animation-name: animate;
            animation-duration: 4s;
            animation-timing-function: ease-out;


        }

        #div5 {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            background-color: rgb(157, 247, 40);
            color: black;
            position: relative;
            text-align: center;
            border-radius: 40px;
            animation-name: animate;
            animation-duration: 4s;
            animation-timing-function: ease-in-out;


        }

        #div6 {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100px;
            height: 100px;
            background-color: rgb(216, 65, 98);
            color: black;
            position: relative;
            text-align: center;
            border-radius: 40px;
            animation-name: animate;
            animation-duration: 4s;
            animation-timing-function: cubic-bezier(0.075, 0.82, 0.165, 1);


        }

        @keyframes animate {

            from {
                left: 0px;
            }

            to {
                left: 400px;
            }

        }
    </style>
</head>

<body>
    <h1>Color Change Animation with from-to </h1>
    <div class="box"></div>
    <h1>Color Change Animation with manual Percentage </h1>
    <div class="box1"></div>

    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>
    <br>

    <div id="div1">Ease</div>
    <div id="div2">Linear</div>
    <div id="div3">Ease-in</div>
    <div id="div4">Ease-out</div>
    <div id="div5">Ease-in-out</div>
    <div id="div6">Cubic-bezier</div>

    
</body>

</html>
