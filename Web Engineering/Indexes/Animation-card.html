<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation Card</title>
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f0f0f0;
            height: 100vh;

        }
        .div {
            display: flex;

            width: 200px;
            height: 100px;
            margin: 20px;
            background-color: teal;
            color: white;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 10px;
           
        }
        .div:hover {
            background-color: coral;
            transform: rotate(10deg);
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="div">Hello </div>
    <div class="div">Keep Smiling </div>
    <div class="div">You are amazing </div>
    <div class="div">Never give up </div>
    <div class="div">Stay positive </div>
</body>
</html>
